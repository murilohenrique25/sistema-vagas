services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sistema_vagas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: sistema_vagas
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sistema_vagas"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?required}
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  ai-service:
    build: ./ai-service
    environment:
      ENVIRONMENT: production
      OPENAI_API_KEY: ${OPENAI_API_KEY:?required}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      BACKEND_BASE_URL: http://backend:8000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?required}
    restart: unless-stopped
  backend:
    build: ./backend
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://sistema_vagas:${POSTGRES_PASSWORD}@postgres:5432/sistema_vagas
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?required}
      AI_SERVICE_URL: http://ai-service:8001
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?required}
      CORS_ORIGINS: '["${PUBLIC_URL:?required}"]'
      FRONTEND_URL: ${PUBLIC_URL:?required}
      PAYMENT_GATEWAY: mercadopago
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:?required}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:?required}
      MERCADOPAGO_PAYER_EMAIL: ${MERCADOPAGO_PAYER_EMAIL:?required}
      PAYMENT_SETTINGS_ENCRYPTION_KEY: ${PAYMENT_SETTINGS_ENCRYPTION_KEY:-}
      DOCS_URL: ""
      REDOC_URL: ""
      OPENAPI_URL: ""
    restart: unless-stopped
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["80:80"]
    restart: unless-stopped
volumes:
  pgdata:
  redisdata:
