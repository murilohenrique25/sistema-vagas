name: sistema-vagas

services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-https://recruta-api.vps6912.panel.icontainer.net}
    depends_on:
      backend:
        condition: service_healthy
    networks: [sistema_vagas_internal]
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-18080}:80"
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, NET_BIND_SERVICE, SETGID, SETUID]
    mem_limit: 256m
    cpus: 0.5

  ai-service:
    build:
      context: ./ai-service
    environment:
      ENVIRONMENT: production
      OPENAI_API_KEY: ${OPENAI_API_KEY:?required}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      BACKEND_BASE_URL: http://backend:8000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?required}
    networks: [sistema_vagas_internal]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 2g
    cpus: 1.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 20s
      timeout: 6s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
    # A migracao e deliberadamente separada para nunca alterar o banco no primeiro start.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    depends_on:
      ai-service:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: &backend_environment
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL:?required}
      REDIS_URL: ${REDIS_URL:?required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?required}
      AI_SERVICE_URL: http://ai-service:8001
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?required}
      CORS_ORIGINS: ${CORS_ORIGINS:?required}
      FRONTEND_URL: ${FRONTEND_URL:?required}
      PAYMENT_GATEWAY: mercadopago
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:?required}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:?required}
      MERCADOPAGO_PAYER_EMAIL: ${MERCADOPAGO_PAYER_EMAIL:-}
      MERCADOPAGO_SANDBOX: ${MERCADOPAGO_SANDBOX:-false}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-email-ssl.com.br}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-true}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-15}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Recruta IA}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      PAYMENT_SETTINGS_ENCRYPTION_KEY: ${PAYMENT_SETTINGS_ENCRYPTION_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      LINKEDIN_REDIRECT_URI: ${LINKEDIN_REDIRECT_URI:-}
      DOCS_URL: ""
      REDOC_URL: ""
      OPENAPI_URL: ""
    networks: [sistema_vagas_internal, hospedagem_redis]
    # Somente o OpenResty do host deve acessar esta porta.
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-18000}:8000"
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 2g
    cpus: 1.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 20s
      timeout: 6s
      retries: 5
      start_period: 30s

  migrate:
    build:
      context: ./backend
    command: ["python", "-m", "alembic", "upgrade", "head"]
    profiles: [tools]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: *backend_environment
    networks: [sistema_vagas_internal]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: "no"

networks:
  sistema_vagas_internal:
    name: sistema_vagas_internal
    driver: bridge
  hospedagem_redis:
    external: true
    name: hospedagem_hospedagem-network
